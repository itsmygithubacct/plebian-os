# Plebian-OS preseed — a REGULAR Debian install that comes up as Pleb.
#
# This is a stock Debian 13 "trixie" install in every respect except two:
#   1. no desktop-environment task is selected (no XFCE/GNOME/KDE) — just the
#      "standard system utilities", plus the handful of packages the Pleb
#      session needs (Xorg, LightDM, git/curl/tar);
#   2. a late_command installs task-pleb-desktop from a signed repository on
#      the disc and enables the first-boot provisioner. First boot uses the
#      installed pleb and kilix packages and registers the Pleb session in
#      place of a desktop environment. It does not clone them.
#
# Everything else is default Debian. Baseline follows Debian's example-preseed;
# only Plebian-specific lines are commented below.
#
# IDENTITY IS DELIBERATELY NOT PRESEEDED. Debian Installer asks for the machine
# hostname, full name, username, and password (including confirmation). Automated
# VM/CI images use a separate generated preseed with an explicit identity and a
# protected credential input; this normal image never carries a shared login.
# Do NOT feed this file straight to debian-installer expecting a hands-off
# install — identity and disk partitioning remain interactive unless the tooling
# selects its separate automated profile.

### Localization (adjust to taste; these are safe defaults)
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string localdomain

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

### Accounts — keep root disabled, but leave every regular-user identity answer
### unset so Debian Installer collects them from the operator. Pleb runs as that
### selected account; provisioning records and resolves it without assuming a
### particular name or uid.
d-i passwd/root-login boolean false

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning — guided, entire disk, all-in-one (test-VM friendly).
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base + apt
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
### non-free carries hardware support the image otherwise cannot offer at all:
### the NVIDIA driver, and the mbrola voice databases behind read-aloud's
### quality tier. Enabling the component only makes those installable; nothing
### non-free is pulled in by default.
d-i apt-setup/non-free boolean true
### Do not stop to ask about extra install media. These are asked below
### critical priority, so they were invisible while the installer ran at
### priority=critical; at priority=high — which is what lets a machine with no
### Ethernet pick a wireless network — an unanswered one halts the install on a
### question no unattended run can answer. The medium we booted from is the
### only medium there is.
d-i apt-setup/cdrom/set-first boolean false
### Disable the install medium's apt entry at the end of every install. Debian
### Installer already does this for USB/ISO-file media and for a CD installed
### with a network mirror, but leaves it enabled on a CD/DVD installed without
### one. First-boot provisioning refuses any apt index outside the Debian
### archive, so that entry failed every attempt of an offline install.
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/another boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Tasksel — the crucial Plebian bit: STANDARD ONLY, no desktop task.
### (This is exactly where "the XFCE Debian install" would select the XFCE
### task; Plebian-OS omits it and lets the Pleb session take that role.)
### No ssh-server by default — the VM builder adds it (it needs SSH to watch
### provisioning); a plain install / USB stick ships without an open sshd.
tasksel tasksel/first multiselect standard

### The disc installs the Pleb session's X stack and the Python, audio, and
### media runtimes for the kilix "95" desktop. The late_command installs the
### Pleb and kilix packages from the disc. Checkout installs get the build
### toolchain and IceWM development headers from provision/install-deps.sh.
### (libxkbcommon-x11-0 + libxcb-xkb1 are what kitty's glfw-x11 backend dlopens
### at runtime — a no-desktop base lacks them and kilix would crash on launch.)
### (openbox is a window manager, not a desktop environment: the Pleb session
### runs it with its own rc.xml so native GUI windows are focusable, raisable
### and Alt-Tabbable. No panel, menu or session manager comes with it.)
### (espeak-ng is Kilix's read-aloud synthesizer and mbrola the runtime behind
### its optional quality tier. The mbrola voice databases are in non-free, which
### this image does not enable, so they stay a deliberate opt-in.)
### (gparted lets an operator repartition the install disk.)
### Kilix Amp renders MIDI in-process with libfluidsynth3 and the GM SoundFont.
### The standalone player's user service can hold the sound card used for
### dictation, so provisioning disables that service when it is present.
### (unattended-upgrades applies Debian security updates after first boot.)
### Versioned package requests below describe the historical snapshot closure.
### The remaster removes their exact versions for live-mirror images; firstboot
### checks the release version floors while accepting current security builds.
d-i pkgsel/include string xserver-xorg xinit lightdm accountsservice openbox x11-xserver-utils x11-utils \
    xterm autocutsel xclip xdotool shellcheck htop strace git curl tar unzip ca-certificates xorriso sudo network-manager \
    bash python3 python-is-python3 coreutils findutils grep sed gawk diffutils procps util-linux \
    libgl1 libegl1 libvulkan1 mesa-vulkan-drivers \
    libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 kitty-terminfo \
    fonts-jetbrains-mono fonts-noto-color-emoji \
    python3-pil python3-numpy python3-scipy python3-xlib python3-websockets python3-venv python3-tk \
    pulseaudio pulseaudio-utils pulsemixer alsa-utils libfluidsynth3 fluid-soundfont-gm \
    libsdl2-2.0-0 libsndfile1 \
    libonnxruntime1.21=1.21.0+dfsg-1 libsamplerate0=0.2.2-4+b2 libssl3t64=3.5.6-1~deb13u2 \
    espeak-ng mbrola poppler-utils \
    ffmpeg mpv okular evince feh tesseract-ocr tesseract-ocr-eng xauth zenity zstd libgomp1 libgfortran5 libquadmath0 zlib1g libbz2-1.0 liblzma5 libzstd1 bzip2 xz-utils zip \
    chromium xfce4-screenshooter \
    xss-lock i3lock libxss1 libx11-6 libxres1 xfce4-power-manager xfconf lxpolkit \
    xdg-utils xdg-user-dirs desktop-file-utils shared-mime-info \
    blueman pulseaudio-module-bluetooth udisks2 udiskie gnome-disk-utility gir1.2-notify-0.7 \
    cups cups-client system-config-printer system-config-printer-udev \
    pavucontrol ibus ibus-gtk ibus-gtk3 ibus-gtk4 orca at-spi2-core \
    systemd libpam-systemd polkitd python3-dbus python3-gi dbus-user-session dbus-x11 xfce4-notifyd libnotify-bin xdg-desktop-portal xdg-desktop-portal-gtk \
    pipewire pipewire-bin wireplumber gstreamer1.0-pipewire gstreamer1.0-x \
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gst-plugins-base-1.0 gir1.2-gtk-3.0 python3-gi-cairo \
    bubblewrap=0.11.0-2+deb13u1 libseccomp2=2.6.0-2 \
    xvfb tigervnc-standalone-server tigervnc-common x11-xkb-utils xfonts-base \
    pciutils usbutils dmidecode lshw lm-sensors kmod ethtool smartmontools nvme-cli linux-perf \
    gparted upower bluez scrot brightnessctl power-profiles-daemon nftables wtmpdb redshift \
    tmux ncdu rsync ufw jq glances ripgrep progress unattended-upgrades \
    android-libext4-utils android-sdk-libsparse-utils e2fsprogs bc \
    chrpath ckermit cpio debianutils diffstat dosfstools \
    erofs-utils fakechroot fakeroot fatcat file genext2fs gettext iputils-ping libacl1 \
    locales lz4 mtools openssh-client parallel \
    parted picocom proot python3-flake8 python3-git python3-jinja2 python3-nose2 python3-pexpect \
    python3-pip python3-setuptools python3-subunit slib socat squashfs-tools tcl texinfo \
    tio tree u-boot-tools wget
d-i pkgsel/upgrade select full-upgrade
### Offline install. The list above needs a network mirror: the netinst media
### carries Debian's base system but not these packages, and without a mirror
### pkgsel stopped the install with "Installation step failed". This hook runs
### before pkgsel reads the list; when the target has no network package source
### it clears the list (first-boot provisioning installs the same groups from
### the network) and records the offline install for late_command. With a
### network source it changes nothing. A snapshot remaster replaces this
### early_command and installs the same hook (build/remaster-iso.sh).
d-i preseed/early_command string set -e; \
    mkdir -p /usr/lib/pre-pkgsel.d; \
    install -m 0755 /cdrom/plebian-os/plebian-os-offline-install /usr/lib/pre-pkgsel.d/05plebian-os-offline
### Match install-deps.sh's --no-install-recommends policy for runtime packages.
d-i base-installer/install-recommends boolean false
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### late_command — install the Plebian-OS packages and desktop task from the signed
### repository on the disc, remove that source and its key, and enable the
### first-boot unit. The provisioner runs on the first real boot, not in the
### installer chroot: the user exists, the network is up via NetworkManager,
### and the packaged pleb and kilix commands are already installed.
###
### Payloads and the other files that are not in the packages are still copied
### from /cdrom/plebian-os/, where the remaster stages them.
d-i preseed/late_command string \
    set -e; \
    mkdir -p /target/usr/sbin /target/usr/bin /target/usr/share/plebian-os/wallpapers /target/usr/share/plebian-os/notices/installer /target/usr/share/plebian-os/notices/espeak-ng /target/var/lib/plebian-os/payloads /target/usr/libexec/plebian-os /target/usr/lib/systemd/system /target/etc/plebian-os /target/etc/lightdm/lightdm-gtk-greeter.conf.d; \
    chown root:root /target/usr/share/plebian-os /target/usr/share/plebian-os/wallpapers /target/usr/share/plebian-os/notices /target/usr/share/plebian-os/notices/installer /target/usr/share/plebian-os/notices/espeak-ng /target/var/lib/plebian-os /target/var/lib/plebian-os/payloads /target/usr/libexec/plebian-os; \
    chmod 0755 /target/usr/share/plebian-os /target/usr/share/plebian-os/wallpapers /target/usr/share/plebian-os/notices /target/usr/share/plebian-os/notices/installer /target/usr/share/plebian-os/notices/espeak-ng /target/var/lib/plebian-os /target/var/lib/plebian-os/payloads /target/usr/libexec/plebian-os; \
    cp /cdrom/plebian-os/plebian-os-record-installed-user /target/etc/plebian-os/.record-installed-user; \
    chmod 0700 /target/etc/plebian-os/.record-installed-user; \
    in-target /bin/sh /etc/plebian-os/.record-installed-user /; \
    rm -f /target/etc/plebian-os/.record-installed-user; \
    if [ -d /cdrom/plebian-os/source-carrier ]; then \
        mkdir -p /target/var/lib/plebian-os/payloads/source-carrier; \
        cp -R /cdrom/plebian-os/source-carrier/. /target/var/lib/plebian-os/payloads/source-carrier/; \
        chown -R root:root /target/var/lib/plebian-os/payloads/source-carrier; \
        chmod -R a+rX,go-w /target/var/lib/plebian-os/payloads/source-carrier; \
    fi; \
    cp /cdrom/plebian-os/default-models.tar.xz /target/var/lib/plebian-os/payloads/default-models.tar.xz; \
    chown root:root /target/var/lib/plebian-os/payloads/default-models.tar.xz; \
    chmod 0644 /target/var/lib/plebian-os/payloads/default-models.tar.xz; \
    cp /cdrom/plebian-os/basic-pitch-icassp-2022-onnx.tar.xz /target/var/lib/plebian-os/payloads/basic-pitch-icassp-2022-onnx.tar.xz; \
    chown root:root /target/var/lib/plebian-os/payloads/basic-pitch-icassp-2022-onnx.tar.xz; \
    chmod 0644 /target/var/lib/plebian-os/payloads/basic-pitch-icassp-2022-onnx.tar.xz; \
    cp /cdrom/plebian-os/demucs-htdemucs-6s.tar /target/var/lib/plebian-os/payloads/demucs-htdemucs-6s.tar; \
    chown root:root /target/var/lib/plebian-os/payloads/demucs-htdemucs-6s.tar; \
    chmod 0644 /target/var/lib/plebian-os/payloads/demucs-htdemucs-6s.tar; \
    cp /cdrom/plebian-os/paradee-8m-v1.2.tar /target/var/lib/plebian-os/payloads/paradee-8m-v1.2.tar; \
    chown root:root /target/var/lib/plebian-os/payloads/paradee-8m-v1.2.tar; \
    chmod 0644 /target/var/lib/plebian-os/payloads/paradee-8m-v1.2.tar; \
    cp /cdrom/plebian-os/en-core-web-sm-3.8.0.tar /target/var/lib/plebian-os/payloads/en-core-web-sm-3.8.0.tar; \
    chown root:root /target/var/lib/plebian-os/payloads/en-core-web-sm-3.8.0.tar; \
    chmod 0644 /target/var/lib/plebian-os/payloads/en-core-web-sm-3.8.0.tar; \
    cp /cdrom/plebian-os/pp-ocrv6-small-det.tar /target/var/lib/plebian-os/payloads/pp-ocrv6-small-det.tar; \
    chown root:root /target/var/lib/plebian-os/payloads/pp-ocrv6-small-det.tar; \
    chmod 0644 /target/var/lib/plebian-os/payloads/pp-ocrv6-small-det.tar; \
    cp /cdrom/plebian-os/pp-ocrv6-small-rec.tar /target/var/lib/plebian-os/payloads/pp-ocrv6-small-rec.tar; \
    chown root:root /target/var/lib/plebian-os/payloads/pp-ocrv6-small-rec.tar; \
    chmod 0644 /target/var/lib/plebian-os/payloads/pp-ocrv6-small-rec.tar; \
    mkdir -p /target/usr/lib/kilix/paradee; \
    tar -x -C /target/usr/lib/kilix/paradee -f /cdrom/plebian-os/paradee-8m-v1.2.tar onnx/paradee_int8.onnx config.json notices/LICENSE-apache-2.0.txt; \
    chown -R root:root /target/usr/lib/kilix/paradee; \
    find /target/usr/lib/kilix/paradee -type d -exec chmod 0755 {} +; \
    find /target/usr/lib/kilix/paradee -type f -exec chmod 0644 {} +; \
    mkdir -p /target/var/lib/plebian-os/payloads/paradee-wheels; \
    cp -a /cdrom/plebian-os/paradee-wheels/. /target/var/lib/plebian-os/payloads/paradee-wheels/; \
    chown -R root:root /target/var/lib/plebian-os/payloads/paradee-wheels; \
    chmod -R a+rX,go-w /target/var/lib/plebian-os/payloads/paradee-wheels; \
    mkdir -p /target/usr/share/plebian-os/notices/espeak-ng; \
    cp /cdrom/plebian-os/espeak-ng-1.52.0.tar.gz /target/usr/share/plebian-os/notices/espeak-ng/espeak-ng-1.52.0.tar.gz; \
    cp /cdrom/plebian-os/espeakng-loader-0.2.4-LICENSE /target/usr/share/plebian-os/notices/espeak-ng/espeakng-loader-0.2.4-LICENSE; \
    cp /cdrom/plebian-os/espeakng-loader-0.2.4-build.txt /target/usr/share/plebian-os/notices/espeak-ng/espeakng-loader-0.2.4-build.txt; \
    cp /cdrom/plebian-os/espeakng-loader-0.2.4-build.sh /target/usr/share/plebian-os/notices/espeak-ng/espeakng-loader-0.2.4-build.sh; \
    chown -R root:root /target/usr/share/plebian-os/notices/espeak-ng; \
    chmod 0755 /target/usr/share/plebian-os/notices/espeak-ng; \
    chmod 0644 /target/usr/share/plebian-os/notices/espeak-ng/*; \
    cp /cdrom/plebian-os/zell-0.1.1-x86_64.tar.xz /target/var/lib/plebian-os/payloads/zell-0.1.1-x86_64.tar.xz; \
    cp /cdrom/plebian-os/zell-runtime.json /target/usr/share/plebian-os/zell-runtime.json; \
    cp /cdrom/plebian-os/install-zell-runtime.py /target/usr/sbin/install-zell-runtime.py; \
    chmod 0755 /target/usr/sbin/install-zell-runtime.py; \
    for neuronte in /cdrom/plebian-os/neuronte-*.tar.xz; do \
        [ -f "$neuronte" ] || continue; \
        cp "$neuronte" "/target/var/lib/plebian-os/payloads/${neuronte##*/}" || exit 1; \
        chown root:root "/target/var/lib/plebian-os/payloads/${neuronte##*/}" || exit 1; \
        chmod 0644 "/target/var/lib/plebian-os/payloads/${neuronte##*/}" || exit 1; \
    done; \
    ollama_version="$(cat /cdrom/plebian-os/VERSION)" || exit 1; \
    awk -v version="$ollama_version" 'BEGIN { exit !(version ~ /^[0-9]+\.[0-9]+\.[0-9]+(\.[1-9][0-9]*)?$/) }' || exit 1; \
    if [ -e /cdrom/plebian-os/ollama-release.env ] || [ -L /cdrom/plebian-os/ollama-release.env ] || [ -e /cdrom/plebian-os/ollama-runtime-carrier.tar.xz ] || awk -v version="$ollama_version" 'BEGIN { split(version, v, "."); exit !(v[1] + 0 > 0 || v[2] + 0 > 2 || (v[2] + 0 == 2 && v[3] + 0 >= 2)) }'; then \
        [ -f /cdrom/plebian-os/ollama-release.env ] && [ ! -L /cdrom/plebian-os/ollama-release.env ] || exit 1; \
        awk -F= -v version="$ollama_version" '$1 == "PLEBIAN_OS_VERSION" { n++; actual=substr($0, index($0, "=") + 1) } END { exit !(n == 1 && actual == version) }' /cdrom/plebian-os/ollama-release.env || exit 1; \
    fi; \
    if [ -f /cdrom/plebian-os/ollama-runtime-carrier.tar.xz ] && [ ! -L /cdrom/plebian-os/ollama-runtime-carrier.tar.xz ]; then \
        cp /cdrom/plebian-os/ollama-runtime-carrier.tar.xz /target/var/lib/plebian-os/payloads/ollama-runtime-carrier.tar.xz; \
        chown root:root /target/var/lib/plebian-os/payloads/ollama-runtime-carrier.tar.xz; \
        chmod 0644 /target/var/lib/plebian-os/payloads/ollama-runtime-carrier.tar.xz; \
    fi; \
    chown root:root /target/etc/lightdm/lightdm-gtk-greeter.conf.d; \
    chmod 0755 /target/etc/lightdm/lightdm-gtk-greeter.conf.d; \
    if [ -f /cdrom/plebian-os/build-info.env ]; then cp /cdrom/plebian-os/build-info.env /target/etc/plebian-os/build-info.env; chown root:root /target/etc/plebian-os/build-info.env; chmod 0644 /target/etc/plebian-os/build-info.env; fi; \
    cp /cdrom/plebian-os/identity-profile /target/etc/plebian-os/identity-profile; \
    chown root:root /target/etc/plebian-os/identity-profile; \
    chmod 0644 /target/etc/plebian-os/identity-profile; \
    if [ -f /cdrom/plebian-os/firstboot.env ]; then mkdir -p /target/etc/default; cp /cdrom/plebian-os/firstboot.env /target/etc/default/plebian-os; fi; \
    mkdir -p /target/mnt/cdrom /target/etc/apt/keyrings /target/etc/apt/sources.list.d /target/var/empty; \
    mount --bind /cdrom /target/mnt/cdrom; \
    cp /cdrom/plebian-os/apt/plebian-os-installer.gpg /target/etc/apt/keyrings/plebian-os-installer.gpg; \
    chmod 0644 /target/etc/apt/keyrings/plebian-os-installer.gpg; \
    printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/plebian-os-installer.gpg] file:/mnt/cdrom/plebian-os/apt trixie main' > /target/etc/apt/sources.list.d/plebian-os-installer.list; \
    in-target dpkg-query -W python3 || echo "plebian-os: python3 is not installed"; \
    in-target apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/plebian-os-installer.list -o Dir::Etc::sourceparts=/var/empty -o APT::Get::List-Cleanup=false; \
    in-target apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/plebian-os-installer.list -o Dir::Etc::sourceparts=/var/empty plebian-os-release plebian-os-tools plebian-os-firstboot plebian-desktop-base plebian-archive-keyring pleb-desktop task-pleb-desktop; \
    rm -f /target/etc/apt/sources.list.d/plebian-os-installer.list /target/etc/apt/keyrings/plebian-os-installer.gpg; \
    umount /target/mnt/cdrom; \
    /bin/sh /cdrom/plebian-os/plebian-os-offline-install late; \
    in-target systemctl enable plebian-os-firstboot.service
