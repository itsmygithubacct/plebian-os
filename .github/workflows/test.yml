name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install shell linter
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Fetch the pinned trees the voice release contract inspects
        # test_voice_release_contract reads the exact KILIX_REF, its
        # kilix-content gitlink and KILIX_VOICE_REF from sibling checkouts
        # (object store only). Fetch just those commits beside this checkout.
        run: |
          manifest="releases/$(cat VERSION).env"
          pin() { sed -n "s/^$1=\([0-9a-f]\{40\}\)\$/\1/p" "$manifest"; }
          fetch() {
            # An empty or partial ref would fetch the default branch instead.
            [[ "$3" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "no exact pinned commit for $1: '$3'" >&2; exit 1; }
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
          }
          kilix_ref="$(pin KILIX_REF)"
          voice_ref="$(pin KILIX_VOICE_REF)"
          fetch ../kilix https://github.com/itsmygithubacct/kilix.git "$kilix_ref"
          content_ref="$(git -C ../kilix rev-parse "$kilix_ref:third_party/kilix-content")"
          fetch ../kilix-content https://github.com/itsmygithubacct/kilix-content.git "$content_ref"
          fetch ../kilix-voice https://github.com/itsmygithubacct/kilix-voice.git "$voice_ref"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: F120 authority profile tests
        # `discover -s tests` never looks under tools/, so the accepted OS0
        # test imported from 019e4116 would otherwise be carried ungated.
        run: python3 -m unittest discover -s tools/closure/tests -t tools/closure -v
      - name: Parse and lint scripts
        run: |
          for shell_script in bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime; do
            bash -n "$shell_script"
          done
          python3 -m py_compile build/*.py provision/plebian-os-passwd provision/native_*.py tests/*.py
          shellcheck -S warning bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime
