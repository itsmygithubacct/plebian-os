name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Target Debian/GNU timeout process-group semantics used by the runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck cpio gzip uidmap xorriso
      - name: Fetch the pinned trees the release contracts inspect
        run: |
          pin() { sed -n "s/^$1=\([0-9a-f]\{40\}\)\$/\1/p" "$manifest"; }
          upstream=https://github.com/itsmygithubacct
          fetch() {
            # An empty or partial ref would fetch the default branch instead.
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "no exact pinned commit for $1: '$2'" >&2; exit 1; }
            git init -q "../$1"
            git -C "../$1" fetch -q --depth 1 "$upstream/$1.git" "$2"
            git -C "../$1" checkout -q --detach "$2"
          }
          catalog_ref() {
            python3 -c 'import json, sys
          with open("../kilix-content/src/kilix_content/catalog/plebian.json") as source:
              entries = json.load(source)[sys.argv[1]]
          print(next(entry["source"]["ref"] for entry in entries if entry["id"] == sys.argv[2]))' "$@"
          }
          # Real first-use and receipt-gate fixtures predating the release.
          fetch kilix-content 7543aa30bd0c7ff60b7d7953e3290b87da10583c
          fetch kilix-voice dacfcaa98e58faffef8876873e7cb5b306890eec
          # Leave the current host materialized for the Voicebox SDK imports.
          for version in 0.2.2 "$(cat VERSION)"; do
            manifest="releases/$version.env"
            kilix_ref="$(pin KILIX_REF)"
            fetch kilix "$kilix_ref"
            fetch kilix-content "$(git -C ../kilix rev-parse "$kilix_ref:third_party/kilix-content")"
            fetch kilix-needle "$(catalog_ref content kilix-needle)"
            fetch kilix-voice "$(pin KILIX_VOICE_REF)"
          done
          fetch kilix-tui-utils "$(catalog_ref packages kilix-tui-utils)"
          # Exercise the released standalone selectors and the legacy OS updaters.
          fetch pleb "$(pin PLEB_REF)"
          for tag in v0.2.2 v0.2.3-rc8 v0.2.3-rc9; do
            git -C ../pleb fetch -q --depth 1 "$upstream/pleb.git" "refs/tags/$tag:refs/tags/$tag"
          done
          git fetch -q --depth 1 "$upstream/plebian-os.git" \
            refs/tags/v0.2.1:refs/tags/v0.2.1 refs/tags/v0.2.3-rc8:refs/tags/v0.2.3-rc8 \
            db8392a7a60cada5a0dfd670b7a3cf09a6e60526
          # The model compliance carrier's producing interfaces
          # (tests/test_model_compliance_carrier.py AC-1, AC-3, AC-4).
          git -C ../kilix-content fetch -q --depth 1 \
            https://github.com/itsmygithubacct/kilix-content.git "$(pin PLEBIAN_OS_VOICE_CARRIER_CONTENT_REF)"
          fetch kilix-license "$(pin KILIX_LICENSE_REF)"
          # AC-8 reads the command model records Needle serves from its own
          # vendored kilix-content, not KILIX_REF's.
          git -C ../kilix-content fetch -q --depth 1 \
            https://github.com/itsmygithubacct/kilix-content.git \
            "$(git -C ../kilix-needle rev-parse "HEAD:third_party/kilix-content")"
          # AC-8 reads the speech licence gate in the kilix-bonsai KILIX_REF installs.
          bonsai_ref="$(git -C ../kilix show "$kilix_ref:scripts/install-kilix-bonsai.sh" \
            | sed -n 's/^KILIX_BONSAI_REF="\${KILIX_BONSAI_REF:-\([0-9a-f]\{40\}\)}"$/\1/p')"
          fetch kilix-bonsai "$bonsai_ref"
      - name: Report timeout provider
        run: command -v timeout && timeout --version
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: F120 authority profile tests
        # `discover -s tests` never looks under tools/, so the accepted OS0
        # test imported from 019e4116 would otherwise be carried ungated.
        run: python3 -m unittest discover -s tools/closure/tests -t tools/closure -v
      - name: Parse and lint scripts
        run: |
          for shell_script in bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime; do
            bash -n "$shell_script"
          done
          python3 -m py_compile build/*.py provision/plebian-os-passwd \
            provision/plebian-os-qt-runtime provision/plebian-os-mpv-runtime provision/plebian-os-install-encodec-converter provision/native_*.py tests/*.py
          shellcheck -S warning bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime
