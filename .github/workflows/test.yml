name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck cpio gzip xorriso
      - name: Fetch the pinned trees the release contracts inspect
        # test_voice_release_contract and test_model_compliance_carrier read the
        # exact KILIX_REF, its kilix-content gitlink, KILIX_VOICE_REF, the native
        # content ref, KILIX_LICENSE_REF and KILIX_REF's kilix-bonsai from sibling
        # checkouts. Materialize the exact trees too: the Voicebox transaction
        # tests import kilix_sdk from the selected host's config directory.
        run: |
          manifest="releases/$(cat VERSION).env"
          pin() { sed -n "s/^$1=\([0-9a-f]\{40\}\)\$/\1/p" "$manifest"; }
          fetch() {
            # An empty or partial ref would fetch the default branch instead.
            [[ "$3" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "no exact pinned commit for $1: '$3'" >&2; exit 1; }
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q --detach FETCH_HEAD
          }
          kilix_ref="$(pin KILIX_REF)"
          voice_ref="$(pin KILIX_VOICE_REF)"
          fetch ../kilix https://github.com/itsmygithubacct/kilix.git "$kilix_ref"
          content_ref="$(git -C ../kilix rev-parse "$kilix_ref:third_party/kilix-content")"
          fetch ../kilix-content https://github.com/itsmygithubacct/kilix-content.git "$content_ref"
          needle_ref="$(python3 -c 'import json; from pathlib import Path; c=json.loads(Path("../kilix-content/src/kilix_content/catalog/plebian.json").read_text()); print(next(x["source"]["ref"] for x in c["content"] if x["id"] == "kilix-needle"))')"
          fetch ../kilix-needle https://github.com/itsmygithubacct/kilix-needle.git "$needle_ref"
          fetch ../kilix-voice https://github.com/itsmygithubacct/kilix-voice.git "$voice_ref"
          # The model compliance carrier's producing interfaces
          # (tests/test_model_compliance_carrier.py AC-1, AC-3, AC-4).
          git -C ../kilix-content fetch -q --depth 1 \
            https://github.com/itsmygithubacct/kilix-content.git "$(pin PLEBIAN_OS_VOICE_CARRIER_CONTENT_REF)"
          fetch ../kilix-license https://github.com/itsmygithubacct/kilix-license.git "$(pin KILIX_LICENSE_REF)"
          # AC-8 reads the speech licence gate in the kilix-bonsai KILIX_REF installs.
          bonsai_ref="$(git -C ../kilix show "$kilix_ref:scripts/install-kilix-bonsai.sh" \
            | sed -n 's/^KILIX_BONSAI_REF="\${KILIX_BONSAI_REF:-\([0-9a-f]\{40\}\)}"$/\1/p')"
          fetch ../kilix-bonsai https://github.com/itsmygithubacct/kilix-bonsai.git "$bonsai_ref"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: F120 authority profile tests
        # `discover -s tests` never looks under tools/, so the accepted OS0
        # test imported from 019e4116 would otherwise be carried ungated.
        run: python3 -m unittest discover -s tools/closure/tests -t tools/closure -v
      - name: Parse and lint scripts
        run: |
          for shell_script in bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime; do
            bash -n "$shell_script"
          done
          python3 -m py_compile build/*.py provision/plebian-os-passwd \
            provision/plebian-os-qt-runtime provision/plebian-os-mpv-runtime provision/plebian-os-install-encodec-converter provision/native_*.py tests/*.py
          shellcheck -S warning bootstrap.sh build/*.sh provision/*.sh \
            provision/plebian-os-firstboot-attempt \
            provision/plebian-os-apt-snapshot-generator \
            provision/plebian-os-native-runtime
